# GitHub Pages and local checks build the shared header and footer with Jekyll.
# Dot-directories are excluded by default, so .well-known is included by name.
#
# The legacy Pages build adds plugins the local build does not run. They turned
# the Markdown files without front matter (rates/register/README.md and
# CHANGELOG.md, assets/credentials/SOURCES.md) into themed pages with the
# default Primer stylesheet, which the site never made or tested. These three
# switches keep those files raw; scripts/check_production.mjs checks the pages
# stay absent.
require_front_matter: true
readme_index:
  enabled: false
theme: null
asset_version: "20261001c"
include:
  - .well-known
exclude:
  - AGENTS.md
  - CLAUDE.md
  - GATES.md
  - graft
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - work
  - DESIGN.md
  - README.md
  - docs
  - lighthouserc.cjs
  - package.json
  - package-lock.json
  - tsconfig.json
  - playwright.capture.config.mjs
  - playwright.config.mjs
  - playwright.webkit.config.mjs
  - pyproject.toml
  - SECURITY.md
  - scripts
  - tests
  - assets/social-card-template.svg
  - assets/social-cards.json
  - assets/fonts/SOURCES.md
