<section class="business-calculator" id="fbt-instalment">
<h2>FBT instalment for a quarter</h2>
<p>An employer that pays FBT by instalments reports one on each activity statement: the ATO’s amount at F1, or a varied amount worked out from its estimate of the year’s FBT at F2 to F4.</p>
<form class="calculator-split" data-calculator="fbt-instalment">
<fieldset disabled><legend>One quarter’s FBT instalment</legend><div class="form-grid">
<div class="field"><label for="fbt-instalment-year">FBT year ended 31 March</label><select name="instalment-year" id="fbt-instalment-year"><option value="2026">2026</option><option value="2027" selected>2027</option></select></div>
<div class="field"><label for="fbt-instalment-quarter">Quarter</label><select name="quarter" id="fbt-instalment-quarter"><option value="1">Quarter ending 30 June</option><option value="2">Quarter ending 30 September</option><option value="3" selected>Quarter ending 31 December</option><option value="4">Quarter ending 31 March</option></select></div>
<div class="field"><label for="fbt-instalment-vary">Vary the instalment on an estimate?</label><select name="vary" id="fbt-instalment-vary"><option value="yes" selected>Yes, on my estimate of the year’s FBT</option><option value="no">No, pay the ATO’s amount</option></select></div>
<label class="field" for="fbt-instalment-ato">Not varying: the ATO instalment amount at F1 (AUD)<input enterkeyhint="next" id="fbt-instalment-ato" name="ato-instalment" type="number" inputmode="decimal" min="0" max="1000000000" step=".01" value="0" /></label>
<label class="field" for="fbt-instalment-estimate">Varying: estimated FBT for the year at F2 (AUD)<input enterkeyhint="next" id="fbt-instalment-estimate" name="estimate" type="number" inputmode="decimal" min="0" max="1000000000" step=".01" value="28000" /></label>
<div class="field"><label for="fbt-instalment-reason">Varying: reason code at F4</label><select name="reason" id="fbt-instalment-reason"><option value="22">22, current business structure not continuing</option><option value="30">30, change in fringe benefits for employees</option><option value="31" selected>31, change in employees with fringe benefits</option><option value="32">32, fringe benefits rebate now claimed</option></select></div>
<label class="field" for="fbt-instalment-previous">Varying a later quarter: instalments for the year that fell due before this one (AUD)<input enterkeyhint="next" id="fbt-instalment-previous" name="previous" type="number" inputmode="decimal" min="0" max="1000000000" step=".01" value="20000" /></label>
<label class="field" for="fbt-instalment-credits">Varying a later quarter: credits claimed at 6B for them (AUD)<input enterkeyhint="next" id="fbt-instalment-credits" name="credits" type="number" inputmode="decimal" min="0" max="1000000000" step=".01" value="0" /></label>
</div>
<button type="submit" class="button">Calculate</button></fieldset>
<output aria-live="polite">Enter the inputs and calculate.</output>
</form>
</section>
