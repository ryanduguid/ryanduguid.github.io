<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found - Ryan Duguid</title>
  <meta name="description" content="That page does not exist on ryanduguid.github.io." />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <style>
    :root {
      --bg: #04001F;
      --surface: #140E24;
      --accent: #5C2D91;
      --accent-light: #9F6FD8;
      --text: #ECECEC;
      --text-muted: #B1AFAD;
      --border: #4F485E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 640px; padding: 2rem 1.5rem; text-align: center; }
    .code {
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: 0.75rem; }
    p.lead { color: var(--text-muted); margin-bottom: 1.75rem; }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
    .links a {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent-light);
      text-decoration: none;
    }
    .links a:first-child { border-color: var(--accent); }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">Error 404</div>
    <h1>I can't reach that!</h1>
    <p class="lead">There is no page at this address. The link may be out of date, or the path may be mistyped.</p>
    <div class="links">
      <a href="/">Home</a>
      <a href="https://github.com/ryanduguid">github.com/ryanduguid</a>
      <a href="https://github.com/ryanduguid/awesome-australian-accounting-tech">Awesome Australian Accounting Tech</a>
    </div>
  </div>
</body>
</html>
