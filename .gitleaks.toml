# Secret and client-identifier scanning, run by .github/workflows/secrets.yml.
#
# The rules are shared: .github/secrets-rules.toml adds 4 client-identifier
# rules (a tax file number, ABN, bank detail or Medicare number beside its
# label) to the default betterleaks credential rules. That file is a copy of
# rules.toml in ryanduguid/release-policy's secrets-scan action, which the
# workflow runs; the action fails when the copy differs. This file holds only
# this repository's allowlists.
#
# Run a local scan from the repository root, where the path below resolves:
# betterleaks git . --config .gitleaks.toml

title = "ryanduguid.github.io"

[extend]
path = ".github/secrets-rules.toml"

[[allowlists]]
description = "The site's own published ABN"
targetRules = ["au-tax-file-number", "au-business-number", "au-bank-account", "au-medicare-number"]
regexes = [
  # The ABN this site publishes in its footer.
  '''^59[ -]?834[ -]?031[ -]?764$''',
]

[[allowlists]]
description = "Published worked examples the tax invoice generator and its tests use"
targetRules = ["au-business-number"]
regexes = [
  # ABN Lookup's worked example in 'Format of the ABN', and the same number with its last digit changed.
  '''^51[ -]?824[ -]?753[ -]?55[67]$''',
  # ASIC's worked example ACN 004 085 616 with the 2 check digits that make it a valid ABN.
  '''^53[ -]?004[ -]?085[ -]?616$''',
]

[[allowlists]]
description = "Placeholder passwords in URLs the source checks' tests expect them to refuse"
targetRules = ["generic-credential-uri"]
condition = "AND"
paths = [
  # The ato_sources and rates tests, and their earlier versions in history.
  '''^scripts/(?:tests/(?:ato_sources|rates)\.rs|check_ato_sources\.test\.mjs|test_rates_register\.py)$''',
]
regexes = [
  # https://user:password@... and https://user:pw@..., URLs carrying
  # credentials the checks must reject.
  '''^(?:password|pw)$''',
]
