[package]
name = "duguid-site-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Duguid-Public-Attribution-1.0"
description = "Build and validation tools for duguid.com.au"
publish = false

[lib]
name = "site_tools"

[[bin]]
name = "site-tools"
path = "src/main.rs"

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
fancy-regex = "0.20.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
libwebp-sys = "0.14.4"
num-bigint = "0.5.1"
num-traits = "0.2.19"
oxc_allocator = "0.158.0"
oxc_codegen = "0.158.0"
oxc_minifier = "0.158.0"
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
png = "0.18.1"
regex = "1.13.1"
roxmltree = "0.21.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"
wuff = { version = "0.2.10", default-features = false, features = ["brotli"] }

# Tests only: proves the minified stylesheets parse to the same rules as the sources.
[dev-dependencies]
lightningcss = { version = "1.0.0-alpha.72", default-features = false }

# build.rs embeds the digest of the sources it builds from (src/source_identity.rs).
[build-dependencies]
sha2 = "0.11.1"

[profile.release]
codegen-units = 1
lto = true

# CI runs every site check with a debug build of site-tools, over thousands of pages;
# level 1 runs them about 3 times faster than level 0.
[profile.dev]
opt-level = 1

# The regex engines dominate test time; optimise dependencies in debug builds.
[profile.dev.package."*"]
opt-level = 3
