[package]
name = "duguid-site-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-ALv2"
description = "Build and validation tools for duguid.com.au"
publish = false

[lib]
name = "site_tools"

[[bin]]
name = "site-tools"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.20.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libwebp-sys = "0.14.4"
num-bigint = "0.5.1"
num-traits = "0.2.19"
png = "0.18.1"
regex = "1.13.1"
roxmltree = "0.21.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true

# The regex engines dominate test time; optimise dependencies in debug builds.
[profile.dev.package."*"]
opt-level = 3
