  <rect x="48" y="48" width="2" height="534" fill="#9b7735" />
  <rect x="1150" y="48" width="2" height="534" fill="#9b7735" />
  <!-- Frame tabs: the renderer sizes each gap and places its crimson brackets around the text. -->
  <g class="tab" data-anchor="start" data-x="96" data-y="45">
    <rect class="gap" height="20" fill="#000000" />
    <rect class="bracket" width="4" height="36" fill="#990024" />
    <rect class="bracket" width="4" height="36" fill="#990024" />
    <text class="mono" fill="#fffff0">{{HOST}}</text>
  </g>
  <g class="tab" data-anchor="end" data-x="1104" data-y="585">
    <rect class="gap" height="20" fill="#000000" />
    <rect class="bracket" width="4" height="36" fill="#990024" />
    <rect class="bracket" width="4" height="36" fill="#990024" />
    <text class="mono" fill="#fffff0">Ryan Duguid</text>
  </g>
