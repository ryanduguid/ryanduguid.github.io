<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">{{TITLE}}</title>
  <desc id="description">{{DESCRIPTION}}</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Besley";
        src: url("data:font/woff2;base64,{{FONT_SERIF}}") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("data:font/woff2;base64,{{FONT_SANS}}") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Spline Sans Mono";
        src: url("data:font/woff2;base64,{{FONT_MONO}}") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      .label {
        font-family: "Public Sans", sans-serif;
        font-size: 30px;
      }
      .heading {
        font-family: "Besley", serif;
        font-size: 46px;
        font-weight: 600;
      }
      .mono {
        font-family: "Spline Sans Mono", monospace;
        font-size: 28px;
      }
      .prompt {
        font-family: "Spline Sans Mono", monospace;
        font-size: 46px;
      }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#000000" />
  <!-- Double dark gold frame, as on the GitHub social previews; the tabs below break it. -->
  <rect x="40" y="40" width="1120" height="2" fill="#9b7735" />
  <rect x="40" y="588" width="1120" height="2" fill="#9b7735" />
  <rect x="40" y="40" width="2" height="550" fill="#9b7735" />
