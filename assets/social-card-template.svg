<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">{{TITLE}}</title>
  <desc id="description">{{DESCRIPTION}}</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Besley";
        src: url("data:font/woff2;base64,{{FONT_SERIF}}") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("data:font/woff2;base64,{{FONT_SANS}}") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Spline Sans Mono";
        src: url("data:font/woff2;base64,{{FONT_MONO}}") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      .label {
        font-family: "Public Sans", sans-serif;
        font-size: 18px;
      }
      .register {
        font-family: "Public Sans", sans-serif;
        font-size: 28px;
      }
      .heading {
        font-family: "Besley", serif;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .host {
        font-family: "Spline Sans Mono", monospace;
        font-size: 24px;
      }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#000000" />
  <rect x="72" y="72" width="1056" height="1" fill="#f2f2f2" />
  <rect x="72" y="552" width="1056" height="1" fill="#f2f2f2" />
  <g transform="translate(984,214)">
    <rect x="16" y="16" width="96" height="8" fill="#f2f2f2" />
    <rect x="16" y="104" width="96" height="8" fill="#f2f2f2" />
    <rect x="16" y="16" width="8" height="96" fill="#f2f2f2" />
    <rect x="104" y="16" width="8" height="96" fill="#f2f2f2" />
    <rect x="32" y="32" width="8" height="64" fill="#4dff88" />
    <rect x="48" y="32" width="48" height="8" fill="#dadada" />
    <rect x="48" y="56" width="40" height="8" fill="#dadada" />
    <rect x="48" y="80" width="32" height="8" fill="#dadada" />
  </g>
  <text class="label" x="128" y="166" fill="#dadada">{{LABEL}}</text>
  <text class="register" x="128" y="218" fill="#f2f2f2">Ryan Duguid</text>
  <text class="heading" fill="#f2f2f2">{{HEADING_LINES}}</text>
  <text class="host" x="128" y="524" fill="#4dff88">{{HOST}}</text>
</svg>
