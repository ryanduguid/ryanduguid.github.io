version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch action updates arrive as one pull request, so they need
      # one rebase and CI run instead of one each. Majors stay separate for review.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The release-policy pin is an immutable full commit SHA, advanced only
      # by a reviewed re-pin of its workflow family. A Dependabot bump adds an
      # unapproved SHA to the portfolio audit without changing the workflow,
      # so re-pin by hand instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
  - package-ecosystem: cargo
    directories:
      - /scripts
      - /scripts/fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      browser-test-tools:
        patterns:
          - "*"
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # GitHub Pages builds and deploys this site with its own pinned Jekyll,
      # and `site-tools build_site` exists to build with that same version. The
      # Gemfile mirrors GitHub Pages rather than tracking upstream Jekyll, so
      # a major or minor bump would have CI validate HTML the live site never
      # produces. Raise the pin when GitHub Pages raises theirs, not when
      # Dependabot offers a release. Patch updates stay open so a security
      # release on the pinned line still reaches us.
      #
      # update-types does not filter security updates, so an advisory fixed
      # only above 3.10 can still open a pull request. That is deliberate:
      # silencing it with a versions ignore would hide the advisory instead of
      # the bump. The Gemfile records that such a pull request is a decision
      # about the Pages build rather than a routine upgrade.
      - dependency-name: jekyll
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
