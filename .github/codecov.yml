# Codecov reads this file from .github/, where Jekyll never publishes it. It
# reports the site tools' Rust coverage and the calculator engines' Node
# coverage together. The project floor is main's measured line coverage
# (97.46% on 27 November 2026, at the merge of #818).
# Raise it with the tests until it reaches 100%, never lower it to pass. Every
# change must test each line it adds or changes. Codecov posts no comments.
coverage:
  round: down
  status:
    project:
      default:
        target: 97.46%
        threshold: 0%
        if_not_found: failure
    patch:
      default:
        target: 100%
        threshold: 0%
# The Windows run of the Rust suites uploads under this flag and counts towards
# the default statuses with the Linux upload. It is never carried forward: a
# commit without its own Windows report leaves the Windows-only lines missed.
flags:
  windows:
    paths:
      - scripts/
    carryforward: false
comment: false
