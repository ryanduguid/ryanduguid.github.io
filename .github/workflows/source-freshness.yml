name: source-freshness

# Re-reads the last commit date of every tool source and opens a pull request
# when a date has moved. The site itself stays static: the dates are baked into
# tools/index.html, so no visitor request ever reaches the GitHub API.
#
# A pull request raised with GITHUB_TOKEN does not start the checks workflow, so
# this job runs every one of those gates itself and pushes only once they pass.
# It runs on Windows because that is where checks.yml captures the visual
# snapshots. Lighthouse is platform-portable here: lighthouserc.cjs takes its
# Chrome from Playwright and applies --no-sandbox only on Linux, and
# scripts/lighthouse-browser.cjs exists to settle a Windows profile-cleanup race.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-freshness
  cancel-in-progress: false

env:
  BRANCH: automation/source-freshness

jobs:
  stamp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Refresh the stamps
        run: node scripts/stamp-source-freshness.mjs --write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop early when no date moved
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- tools/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser-test dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.changed.outputs.changed == 'true'
        run: npx playwright install chromium

      - name: Site checks
        if: steps.changed.outputs.changed == 'true'
        run: python scripts/check_site.py

      - name: Proof capture check
        if: steps.changed.outputs.changed == 'true'
        run: npm run test:capture

      - name: Browser checks
        if: steps.changed.outputs.changed == 'true'
        run: npm run test:browser

      - name: Lighthouse checks
        if: steps.changed.outputs.changed == 'true'
        run: npm run test:lighthouse

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-freshness-failure-evidence
          path: |
            work/playwright-report
            work/test-results
            work/lighthouse
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7

      - name: Open or update the pull request
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "Refresh source freshness stamps"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Refresh source freshness stamps" \
              --body "The last commit date of one or more tool sources has moved. Dates come from the GitHub API at build time and are baked into tools/index.html, so the published site makes no runtime request. The site, capture, browser and Lighthouse gates all passed on this branch before it was pushed."
          fi
