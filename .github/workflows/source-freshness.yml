name: source-freshness

# Re-reads the last commit date of every tool source and opens a pull request
# when a date has moved. The site itself stays static: the dates are baked into
# tools/index.html, so no visitor request ever reaches the GitHub API.
# A separate job flags newer stable releases for editorial review in a tracking
# issue; it never rewrites capability descriptions or evaluation references.
#
# A pull request raised with GITHUB_TOKEN does not start the checks workflow, so
# the stamp job runs the site checks itself and hands its change on only once they
# pass. The change only rewrites date strings in tools/index.html, and
# `site-tools check_site` holds the date contract; the live link, browser and
# Lighthouse gates run on the merge to main. The site checks here run offline:
# without a token the archived-repository lookups exhaust the runner's shared API
# limit. The stamp job builds and runs site-tools with read-only access; the
# publish job, which can write, applies the stamp job's patch and runs no tools.

on:
  schedule:
    - cron: "0 6 * * 1"
    # The other six days run the release check alone, so a new release is
    # flagged within a day. The production and stamp jobs skip this schedule.
    - cron: "0 6 * * 0,2-6"
  workflow_dispatch:
    inputs:
      releases_only:
        description: Check release references without refreshing dates or checking the live site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: source-freshness
  cancel-in-progress: false

env:
  BRANCH: automation/source-freshness

jobs:
  # A red scheduled run notifies nobody, so drift is also kept in one tracking
  # issue: opened on the first drift, rewritten while drift remains and closed by
  # the first run that finds none. An outage (exit 2) leaves the issue alone.
  releases:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      TITLE: Release references are behind the current releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check current release references
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/stamp-source-freshness.mjs --check-releases 2> "$RUNNER_TEMP/drift.txt"
          status=$?
          cat "$RUNNER_TEMP/drift.txt" >&2
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Open, update or close the tracking issue
        if: ${{ !cancelled() && (steps.check.outputs.status == '0' || steps.check.outputs.status == '1') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.check.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ "$STATUS" = 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "No release drift in $RUN_URL."
            fi
            exit 0
          fi
          {
            echo "The daily release check found pages naming an older release than the current one."
            echo "Review each page and its capability descriptions; the check rewrites nothing."
            echo "Dispatch source-freshness.yml with releases_only=true after a fix; a clean run closes this issue."
            echo
            sed 's/^/- /' "$RUNNER_TEMP/drift.txt"
            echo
            echo "Last checked: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            # A body edit notifies nobody, so a changed drift list also gets a comment.
            old=$(gh issue view "$number" --json body --jq .body | tr -d '\r' | grep -v '^Last checked: ')
            new=$(grep -v '^Last checked: ' "$RUNNER_TEMP/body.md")
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            if [ "$old" != "$new" ]; then
              gh issue comment "$number" --body "The drift list changed in $RUN_URL."
            fi
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  # The public site is delivered through Cloudflare, which can rewrite the
  # HTML and add headers the repository never sees. This job fetches the live
  # pages and holds them to the delivery promises README.md records.
  production:
    if: github.event.schedule != '0 6 * * 0,2-6' && (github.event_name != 'workflow_dispatch' || !inputs.releases_only)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check the site as delivered
        run: node scripts/check_production.mjs

  stamp:
    if: github.event.schedule != '0 6 * * 0,2-6' && (github.event_name != 'workflow_dispatch' || !inputs.releases_only)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        working-directory: scripts
        run: rustup toolchain install 1.99 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: scripts -> target
      - name: Build site-tools
        working-directory: scripts
        run: cargo build --locked

      - name: Refresh the stamps
        run: node scripts/stamp-source-freshness.mjs --write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild the full-text index from the stamped page
        run: scripts/target/debug/site-tools build_llms_full --write

      - name: Stop early when no date moved
        id: changed
        shell: bash
        run: |
          if git diff --quiet -- tools/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Site checks
        if: steps.changed.outputs.changed == 'true'
        run: scripts/target/debug/site-tools check_site --offline

      - name: Record the change
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: git diff --binary > "$RUNNER_TEMP/stamps.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changed.outputs.changed == 'true'
        with:
          name: source-freshness-stamps
          path: ${{ runner.temp }}/stamps.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: stamp
    if: needs.stamp.outputs.changed == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # The only job that writes: it pushes the stamp branch and opens the pull request.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No stored credentials; the push step authenticates itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-freshness-stamps
          path: ${{ runner.temp }}/stamps
      - name: Open or update the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git apply --index "$RUNNER_TEMP/stamps/stamps.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "Refresh source freshness stamps"
          gh auth setup-git
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Refresh source freshness stamps" \
              --body "The last commit date of one or more tool sources has moved. Dates come from the GitHub API at build time and are baked into tools/index.html, so the published site makes no runtime request. The offline site checks passed on this branch before it was pushed; live link checks run on the merge to main."
          fi
