name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  # Only replace obsolete PR validation. Every main revision keeps its checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.8" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy

  checks:
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in scripts/check_links.py.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --ci

      - name: Package the validated Pages tree
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/.well-known/llms.txt
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > _site/.well-known/deployment.json
          # Preserve .well-known, which upload-pages-artifact excludes.
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload this run's validated Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 7

  browser:
    timeout-minutes: 30
    runs-on: windows-2025
    strategy:
      # Let every shard finish so a failure keeps the other shard's evidence.
      fail-fast: false
      matrix:
        # Playwright's --shard splits the browser tests. Shard 1 also runs the
        # one-off contract, capture and dependency checks.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select metadata-only browser checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: pwsh
        run: |
          $selection = @(python scripts/check_site.py --ci-metadata-only)
          if ($LASTEXITCODE -ne 0 -or $selection.Count -ne 1 -or $selection[0] -cnotin @('true', 'false')) {
            throw 'Invalid CI metadata selection'
          }
          "metadata_only=$($selection[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci
      - name: Check calculator and WebMCP contracts
        if: ${{ matrix.shard == 1 }}
        run: npm run typecheck
      - name: Install Chromium
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npx playwright install chromium
      - name: Proof capture check
        if: ${{ steps.metadata.outputs.metadata_only == 'false' && matrix.shard == 1 }}
        run: npm run test:capture
      - name: Browser checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npm audit --audit-level=high

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # lighthouserc.cjs splits the pages by LHCI_SHARD.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select metadata-only Lighthouse checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          python scripts/check_site.py --ci-metadata-only > "$RUNNER_TEMP/ci-metadata-selection.txt"
          mapfile -t selection < "$RUNNER_TEMP/ci-metadata-selection.txt"
          if [[ ${#selection[@]} != 1 || ( ${selection[0]} != true && ${selection[0]} != false ) ]]; then
            echo "Invalid CI metadata selection" >&2
            exit 1
          fi
          printf 'metadata_only=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          node-version: "24"
          cache: npm
      - name: Install quality dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm ci
      - name: Install Chromium and system dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npx playwright install --with-deps chromium
      - name: Lighthouse checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        env:
          LHCI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        # Evidence is for diagnosing a failed assertion; a passing run's
        # reports are about 20 MB each and nothing reads them.
        if: ${{ failure() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-evidence-${{ matrix.shard }}
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  checks-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, checks, browser, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: |
            .github
            scripts
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/checks.yml checks-gates --exempt deploy
      - name: Require external publication results for this main commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_publication.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600

  deploy:
    needs: checks-gates
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks-gates.result == 'success' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download the validated artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify the artifact before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/validated-site"
          tar --extract --file "$RUNNER_TEMP/pages-artifact/artifact.tar" --directory "$RUNNER_TEMP/validated-site"
          python3 -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"validated-site/.well-known/deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          node scripts/check_production.mjs --source-root "$RUNNER_TEMP/validated-site" --source-only
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Revalidate main and external results after environment admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_publication.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
      - name: Verify the published source identity and delivery contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "${PAGE_URL%/}/.well-known/deployment.json?revision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/deployment.json"
          python -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          node scripts/check_production.mjs --source-root "$RUNNER_TEMP/validated-site"
