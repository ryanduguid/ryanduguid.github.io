name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.8" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy

  checks:
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in scripts/check_links.py.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --ci

  browser:
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select metadata-only browser checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: pwsh
        run: |
          $selection = @(python scripts/check_site.py --ci-metadata-only)
          if ($LASTEXITCODE -ne 0 -or $selection.Count -ne 1 -or $selection[0] -cnotin @('true', 'false')) {
            throw 'Invalid CI metadata selection'
          }
          "metadata_only=$($selection[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci
      - name: Check calculator and WebMCP contracts
        run: npm run typecheck
      - name: Install Chromium
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npx playwright install chromium
      - name: Proof capture check
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:capture
      - name: Browser checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:browser
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Select metadata-only Lighthouse checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          python scripts/check_site.py --ci-metadata-only > "$RUNNER_TEMP/ci-metadata-selection.txt"
          mapfile -t selection < "$RUNNER_TEMP/ci-metadata-selection.txt"
          if [[ ${#selection[@]} != 1 || ( ${selection[0]} != true && ${selection[0]} != false ) ]]; then
            echo "Invalid CI metadata selection" >&2
            exit 1
          fi
          printf 'metadata_only=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          node-version: "24"
          cache: npm
      - name: Install quality dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm ci
      - name: Install Chromium and system dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npx playwright install --with-deps chromium
      - name: Lighthouse checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        # Evidence is for diagnosing a failed assertion; a passing run's
        # reports are about 20 MB each and nothing reads them.
        if: ${{ failure() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-evidence
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  checks-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, checks, browser, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/checks.yml checks-gates
