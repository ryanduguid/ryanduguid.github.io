name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  # Only replace obsolete PR validation. Every main revision keeps its checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The site tools are the Rust crate in scripts/; scripts/rust-toolchain.toml pins
# the compiler that RUST_TOOLCHAIN installs.
env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.99"

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
          # Keeps the hash-pinned wheels between runs; pip still checks every hash.
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check --only-binary ':all:' --require-hashes --requirement requirements-lint.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            scripts -> target
            scripts/fuzz -> target
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust format
        working-directory: scripts
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      - name: Clippy
        working-directory: scripts
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path fuzz/Cargo.toml -- -D warnings

  tools:
    # Builds site-tools once per runner OS in a read-only job. The browser and
    # Lighthouse jobs serve the site with it, and the jobs that publish run it
    # without compiling anything themselves. Because the deploy job runs the
    # Linux binary, that one is built without a restored cache, in the dev
    # profile (whose dependencies are optimised) rather than the slower fully
    # optimised release. The Windows binary only serves the browser tests, so it
    # reuses the cache the rust-windows job saves on main.
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os == 'Windows'
        with:
          workspaces: scripts -> target
          shared-key: windows-debug
          save-if: false
      - name: Build site-tools
        run: cargo build --locked --bin site-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-tools-${{ runner.os }}
          path: scripts/target/debug/site-tools${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  rust-windows:
    # The site checks run every Rust suite on Linux against the rendered site.
    # This runs them on Windows too, with the locked Jekyll; the suites render
    # the site once and share it.
    timeout-minutes: 30
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: .
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts -> target
          shared-key: windows-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests
        run: cargo test --locked

  checks:
    # Runs alongside lint rather than after it; checks-gates still requires both.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build site-tools
        working-directory: scripts
        run: cargo build --locked
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in site-tools check_links.
          GITHUB_TOKEN: ${{ github.token }}
        # check_site runs each Rust suite through cargo test against the checked tree.
        run: scripts/target/debug/site-tools check_site --ci

      - name: Package the validated Pages tree
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/.well-known/llms.txt
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > _site/.well-known/deployment.json
          # Preserve .well-known, which upload-pages-artifact excludes.
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload this run's validated Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: tools
    timeout-minutes: 30
    runs-on: windows-2025
    strategy:
      # Let every shard finish so a failure keeps the other shard's evidence.
      fail-fast: false
      matrix:
        # Playwright's --shard splits the browser tests. Shard 1 also runs the
        # one-off contract, capture and dependency checks.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Windows
          path: ${{ runner.temp }}/site-tools
      - name: Select metadata-only browser checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: pwsh
        run: |
          # Playwright's web server runs the same binary (playwright.config.mjs).
          $tools = Join-Path $env:RUNNER_TEMP 'site-tools\site-tools.exe'
          "SITE_TOOLS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $selection = @(& $tools check_site --ci-metadata-only)
          if ($LASTEXITCODE -ne 0 -or $selection.Count -ne 1 -or $selection[0] -cnotin @('true', 'false')) {
            throw 'Invalid CI metadata selection'
          }
          "metadata_only=$($selection[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        # No locked package has an install script; this keeps it that way.
        run: npm ci --ignore-scripts
      - name: Check calculator and WebMCP contracts
        if: ${{ matrix.shard == 1 }}
        run: npm run typecheck
      # The browser build for the locked Playwright, kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        # The locked Playwright, as the Lighthouse job runs it; npx could fetch another.
        shell: bash
        run: ./node_modules/.bin/playwright install chromium
      - name: Proof capture check
        if: ${{ steps.metadata.outputs.metadata_only == 'false' && matrix.shard == 1 }}
        run: npm run test:capture
      - name: Browser checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npm audit --audit-level=high

  lighthouse:
    needs: tools
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # lighthouserc.cjs splits the pages by LHCI_SHARD.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Select metadata-only Lighthouse checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          # Artifacts drop the executable bit. Lighthouse's server runs the same
          # binary (lighthouserc.cjs).
          tools="$RUNNER_TEMP/site-tools/site-tools"
          chmod +x "$tools"
          printf 'SITE_TOOLS=%s\n' "$tools" >> "$GITHUB_ENV"
          "$tools" check_site --ci-metadata-only > "$RUNNER_TEMP/ci-metadata-selection.txt"
          mapfile -t selection < "$RUNNER_TEMP/ci-metadata-selection.txt"
          if [[ ${#selection[@]} != 1 || ( ${selection[0]} != true && ${selection[0]} != false ) ]]; then
            echo "Invalid CI metadata selection" >&2
            exit 1
          fi
          printf 'metadata_only=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          node-version: "24"
          cache: npm
      - name: Install quality dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm ci --ignore-scripts
      # The browser build for the locked Playwright, kept between runs; the system
      # libraries it needs are still installed each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and system dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Lighthouse checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        env:
          LHCI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        # Evidence is for diagnosing a failed assertion; a passing run's
        # reports are about 20 MB each and nothing reads them.
        if: ${{ failure() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-evidence-${{ matrix.shard }}
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  fuzzing:
    name: fuzz the changelog feed builder
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned nightly
        run: rustup toolchain install nightly-2026-10-15 --profile minimal
      # Keeps the fuzz build and the installed cargo-fuzz between runs, so the
      # locked source install below is a no-op once cached.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned fuzzer
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the feed builder
        run: >-
          cargo +nightly-2026-10-15 fuzz run feed fuzz-corpus/feed --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  checks-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, tools, rust-windows, checks, browser, lighthouse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/checks.yml checks-gates --exempt deploy --exempt fuzzing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Require external publication results for this main commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x "$RUNNER_TEMP/site-tools/site-tools"
          "$RUNNER_TEMP/site-tools/site-tools" check_publication --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600

  deploy:
    needs: checks-gates
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks-gates.result == 'success' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Download the validated artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify the artifact before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/validated-site"
          tar --extract --file "$RUNNER_TEMP/pages-artifact/artifact.tar" --directory "$RUNNER_TEMP/validated-site"
          python3 -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"validated-site/.well-known/deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          node scripts/check_production.mjs --source-root "$RUNNER_TEMP/validated-site" --source-only
      # Built by the read-only tools job; this job compiles nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Revalidate main and external results after environment admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x "$RUNNER_TEMP/site-tools/site-tools"
          "$RUNNER_TEMP/site-tools/site-tools" check_publication --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.sha }}-${{ github.run_attempt }}
      - name: Verify the published source identity and delivery contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "${PAGE_URL%/}/.well-known/deployment.json?revision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/deployment.json"
          python3 -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          node scripts/check_production.mjs --source-root "$RUNNER_TEMP/validated-site"
