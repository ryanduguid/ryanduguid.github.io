name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Levy engine tests
        run: node --test scripts/levy.test.mjs
      - name: Link and content checks
        run: python scripts/check_links.py
      - name: Metadata checker tests
        run: python scripts/test_check_seo.py
      - name: Metadata and structured data checks
        run: python scripts/check_seo.py
