name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy

  checks:
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in scripts/check_links.py.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --ci

  browser:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Proof capture check
        run: npm run test:capture
      - name: Browser checks
        run: npm run test:browser
      - name: Repeat homepage screenshot checks without retries
        run: npm run test:browser -- --grep "home matches its viewport visual baseline" --repeat-each=20 --retries=0
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install quality dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Lighthouse checks
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-evidence
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7
