name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.8" "mypy==2.3.1"
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy

  checks:
    needs: lint
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in scripts/check_links.py.
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_site.py --ci

  browser:
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Proof capture check
        run: npm run test:capture
      - name: Browser checks
        run: npm run test:browser
      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

  lighthouse:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install quality dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Lighthouse checks
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        # Evidence is for diagnosing a failed assertion; a passing run's
        # reports are about 20 MB each and nothing reads them.
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-evidence
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  checks-gates:
    # The one context branch protection requires from this workflow. It runs
    # on every event and fails unless every job it needs succeeded, and its
    # last step fails when a job in this file is missing from needs, so a new
    # job or matrix leg is enforced without a protection change.
    needs: [lint, checks, browser, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, value in results.items() if value["result"] != "success"]
          if failed:
              raise SystemExit("Jobs did not succeed: " + ", ".join(failed))
      - name: Check out the workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Require needs to list every other job in this file
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, re
          text = open(".github/workflows/checks.yml", encoding="utf-8").read()
          keys = re.findall(r"(?m)^  [\"']?([A-Za-z_][\w-]*)[\"']?:", text.split("\njobs:\n", 1)[1])
          jobs = set(keys)
          if "checks-gates" not in jobs:
              raise SystemExit("Could not read the job list; the gate check needs updating")
          missing = sorted(jobs - {"checks-gates"} - set(json.loads(os.environ["RESULTS"])))
          if missing:
              raise SystemExit("Add these jobs to needs: " + ", ".join(missing))
