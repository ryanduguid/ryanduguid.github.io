name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Levy engine tests
        run: node --test scripts/levy.test.mjs
      - name: Diagnose ATO access from the runner
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          cases = (
              ("current", "https://www.ato.gov.au/", "ryanduguid.github.io-link-check"),
              (
                  "browser",
                  "https://www.ato.gov.au/",
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/128.0 Safari/537.36",
              ),
              ("bare-domain", "https://ato.gov.au/", "ryanduguid.github.io-link-check"),
          )
          for label, url, user_agent in cases:
              request = urllib.request.Request(url, headers={"User-Agent": user_agent})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(label, response.status, response.geturl())
              except urllib.error.HTTPError as error:
                  print(label, error.code, error.geturl())
              except Exception as error:
                  print(label, type(error).__name__, str(error))
          PY
      - name: Link and content checks
        run: python scripts/check_links.py
      - name: Metadata and structured data checks
        run: python scripts/check_seo.py
