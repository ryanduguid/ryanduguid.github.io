name: checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 1"

permissions:
  contents: read

concurrency:
  # Only replace obsolete PR validation. Every main revision keeps its checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The site tools are the Rust crate in scripts/; scripts/rust-toolchain.toml pins
# the compiler that RUST_TOOLCHAIN installs.
env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.99"

jobs:
  coal-lsl-service:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: service/coal-lsl-levy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: service/coal-lsl-levy/package-lock.json
      - run: npm ci --ignore-scripts
      # npm test's suite, with line coverage. c8 merges the coverage of every
      # process the suite starts: the test runner's own merge can count a line
      # no process ran (nodejs/node#66860). The paths gain the service's folder
      # so Codecov finds them from the repository root.
      - name: Service tests with line coverage
        shell: bash
        run: |
          node deploy/build-worker.mjs
          node_modules/.bin/c8 --reporter=lcovonly --reports-dir=coverage-service \
            --include='src/**/*.mjs' --include='bin/**/*.mjs' \
            --include='deploy/**/*.mjs' --include='conformance/**/*.mjs' \
            node --test --test-reporter=spec 'test/*.test.mjs'
          mv coverage-service/lcov.info coverage-service.lcov
          sed -i 's|^SF:|SF:service/coal-lsl-levy/|' coverage-service.lcov
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-service
          path: service/coal-lsl-levy/coverage-service.lcov
          if-no-files-found: error
          retention-days: 1
      - run: npm run conformance
      - run: npm run check:worker
      - run: npm audit --audit-level=high

  lint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      SHELLCHECK_VERSION: "0.11.0"
      # Computed from the v0.11.0 release tarball at pin time; koalaman
      # publishes no checksums file.
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify shellcheck
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum --check
          tar -xJf "shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - name: Download and verify actionlint
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
      - name: Lint the workflows with actionlint and shellcheck
        run: ./actionlint -shellcheck "./shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
          # Keeps the hash-pinned wheels between runs; pip still checks every hash.
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check --only-binary ':all:' --require-hashes --requirement requirements-lint.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            scripts -> target
            scripts/fuzz -> target
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust format
        working-directory: scripts
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      # --locked also fails a stale fuzz/Cargo.lock (scripts/fuzz/README.md).
      - name: Clippy
        working-directory: scripts
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path fuzz/Cargo.toml -- -D warnings

  tools:
    # Builds site-tools once per runner OS in a read-only job, and builds and
    # minifies _site once on Linux for the browser and Lighthouse shards. The
    # browser and Lighthouse jobs serve that prebuilt tree without running
    # Jekyll again, and the jobs that publish run site-tools without compiling.
    # Because the deploy job runs the Linux binary on main pushes, main builds
    # it without a restored Rust cache; pull requests reuse main's cache in the
    # dev profile (whose dependencies are optimised). The Windows binary only
    # serves the browser tests, so it restores the Windows cache this job saves
    # on main.
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os == 'Windows'
        with:
          workspaces: scripts -> target
          shared-key: windows-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        with:
          workspaces: scripts -> target
          shared-key: linux-debug
          save-if: false
      - name: Build site-tools
        run: cargo build --locked --bin site-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-tools-${{ runner.os }}
          path: scripts/target/debug/site-tools${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Select metadata-only site build
        id: metadata
        if: runner.os == 'Linux'
        working-directory: .
        env:
          CI_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scripts/target/debug/site-tools check_site --ci-metadata-only > "$RUNNER_TEMP/ci-metadata-selection.txt"
          mapfile -t selection < "$RUNNER_TEMP/ci-metadata-selection.txt"
          if [[ ${#selection[@]} != 1 || ( ${selection[0]} != true && ${selection[0]} != false ) ]]; then
            echo "Invalid CI metadata selection" >&2
            exit 1
          fi
          printf 'metadata_only=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        if: ${{ runner.os == 'Linux' && steps.metadata.outputs.metadata_only == 'false' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: .
      - name: Build and minify site for browser and Lighthouse shards
        if: ${{ runner.os == 'Linux' && steps.metadata.outputs.metadata_only == 'false' }}
        working-directory: .
        run: |
          set -euo pipefail
          scripts/target/debug/site-tools build_site
          scripts/target/debug/site-tools minify_site _site
          test -f _site/index.html
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/served-site.tar" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ runner.os == 'Linux' && steps.metadata.outputs.metadata_only == 'false' }}
        with:
          name: served-site
          path: ${{ runner.temp }}/served-site.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  rust-windows:
    # The site checks run every Rust suite on Linux against the rendered site.
    # This runs them on Windows too, with the locked Jekyll; the suites render
    # the site once and share it. It measures line coverage there as well, so
    # Codecov merges the Windows-only branches with the Linux report.
    timeout-minutes: 45
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: .
      - name: Render site for tests
        working-directory: .
        run: |
          set -euo pipefail
          checked="$RUNNER_TEMP/site-checked"
          rm -rf "$checked"
          bundle exec jekyll build --destination "$checked"
          cp -r scripts .agents docs "$checked/"
          cp README.md _config.yml "$checked/"
          cp assets/social-card-template.svg assets/social-cards.json "$checked/assets/"
          printf 'SITE_CHECKED=%s\n' "$(cygpath -w "$checked")" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
      - name: Install the pinned cargo-llvm-cov
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts -> target/llvm-cov-target
          shared-key: windows-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests with line coverage
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/coverage-rust-windows.lcov"
          cargo llvm-cov --locked --no-report
          cargo llvm-cov report --lcov --output-path "$report"
          # Codecov needs repository paths with forward slashes, not the runner's.
          workspace="$(cygpath -m "$GITHUB_WORKSPACE")"
          sed -i -e '/^SF:/ y/\\/\//' -e "s|^SF:${workspace}/|SF:|I" "$report"
          if grep -qE '^SF:([A-Za-z]:|/)' "$report"; then
            echo "::error::Coverage source is outside the repository"
            exit 1
          fi
      - name: Keep the Windows coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov-windows
          path: coverage-rust-windows.lcov
          if-no-files-found: error
          retention-days: 1

  checks:
    # Runs alongside lint rather than after it; checks-gates still requires both.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked-script runner
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts -> target
          shared-key: linux-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build site-tools
        working-directory: scripts
        run: cargo build --locked
      - name: Site checks
        env:
          CI_EVENT: ${{ github.event_name }}
          # Lifts the unauthenticated GitHub API rate limit for the
          # archived-repository lookups in site-tools check_links.
          GITHUB_TOKEN: ${{ github.token }}
        # Run a copy outside scripts/target so cargo test inside check_site
        # never replaces the running binary. Line coverage runs in parallel in
        # the rust-coverage job.
        shell: bash
        run: |
          cp scripts/target/debug/site-tools "$RUNNER_TEMP/site-tools"
          "$RUNNER_TEMP/site-tools" check_site --ci

      - name: Package the validated Pages tree
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/.well-known/llms.txt
          # The checks above read the readable build; the browser and Lighthouse
          # jobs' server minifies the same way (site-tools serve_site).
          "$RUNNER_TEMP/site-tools" minify_site _site
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > _site/.well-known/deployment.json
          # Preserve .well-known, which upload-pages-artifact excludes.
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload this run's validated Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Named by SHA alone, so a rerun of only the failed deploy finds it; a rerun
          # of this job replaces it.
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  rust-coverage:
    # Runs in parallel with checks so llvm-cov instrumentation and the suites
    # check_site omits do not run serially after Site checks. The floor is
    # site-tools' measured line coverage, rounded down (80.54% on 3 November
    # 2026). Raise it with the tests, never lower it to pass.
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools
      - name: Install the pinned cargo-llvm-cov
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts -> target/llvm-cov-target
          shared-key: linux-llvm-cov
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests with line coverage
        working-directory: scripts
        shell: bash
        run: |
          cargo llvm-cov --locked --no-report
          cargo llvm-cov report --fail-under-lines 80
          cargo llvm-cov report --lcov --output-path "$GITHUB_WORKSPACE/coverage-rust.lcov"
          # Codecov needs repository paths, not the runner's.
          sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$GITHUB_WORKSPACE/coverage-rust.lcov"
          if grep -q '^SF:/' "$GITHUB_WORKSPACE/coverage-rust.lcov"; then
            echo "::error::Coverage source is outside the repository"
            exit 1
          fi
      # The calculator engines' Node suites, as check_site runs them, plus
      # super-lump-sum-options, which only mutation-check runs. Page modules that
      # only the browser tests load are not measured here. c8 merges the test
      # processes' coverage: the test runner's own merge can count a line no
      # process ran (nodejs/node#66860).
      - run: npm ci --ignore-scripts
      - name: Calculator engine tests with line coverage
        shell: bash
        run: |
          node_modules/.bin/c8 --reporter=lcovonly --reports-dir=coverage-js --include='assets/**/*.mjs' \
          node --test --test-reporter=dot \
          scripts/levy.test.mjs scripts/business-calculators.test.mjs \
          scripts/first-home-grant.test.mjs scripts/individual-tax.test.mjs \
          scripts/field-errors.test.mjs scripts/webmcp-tools.test.mjs \
          scripts/rate-tables.test.mjs scripts/depreciation-rates.test.mjs \
          scripts/super-lump-sum-options.test.mjs \
          scripts/individual-results-branches.test.mjs scripts/fhss-work-pcg-branches.test.mjs \
          scripts/page-dom.test.mjs scripts/webmcp-branches.test.mjs \
          scripts/borrowing-fuel-fbt-levy-branches.test.mjs scripts/engine-notes-refusals.test.mjs \
          scripts/engine-refusal-paths.test.mjs scripts/engine-edge-cases.test.mjs \
          scripts/ato-penalties-branches.test.mjs scripts/fuel-tax-credits-branches.test.mjs \
          scripts/trust-streaming-branches.test.mjs scripts/gst-adjustments-page-branches.test.mjs \
          scripts/rental-property-branches.test.mjs
          mv coverage-js/lcov.info coverage-js.lcov
      - name: Keep the coverage reports for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: |
            coverage-rust.lcov
            coverage-js.lcov
          if-no-files-found: error
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. checks-gates exempts it; Codecov reports its own
  # project and patch statuses against codecov.yml.
  codecov:
    name: upload coverage to Codecov
    needs: [rust-coverage, rust-windows, coal-lsl-service]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-codecov
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-service
      # One upload per flag, so codecov.yml can hold each part to its own floor.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust.lcov
          flags: rust
          disable_search: true
          fail_ci_if_error: true
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-js.lcov
          flags: javascript
          disable_search: true
          fail_ci_if_error: true
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-service.lcov
          flags: coal-lsl-service
          disable_search: true
          fail_ci_if_error: true
      # The Windows run is its own upload under the windows flag; Codecov merges
      # it with the Linux upload for the commit, so a line either run executes
      # counts as covered.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-codecov-windows
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust-windows.lcov
          flags: windows
          disable_search: true
          fail_ci_if_error: true

  browser:
    needs: tools
    timeout-minutes: 30
    runs-on: windows-2025
    strategy:
      # Let every shard finish so a failure keeps the other shard's evidence.
      fail-fast: false
      matrix:
        # Playwright's --shard splits the browser tests. Shard 1 also runs the
        # one-off contract, capture and dependency checks.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Windows
          path: ${{ runner.temp }}/site-tools
      - name: Select metadata-only browser checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: pwsh
        run: |
          # Playwright's web server runs the same binary (playwright.config.mjs).
          $tools = Join-Path $env:RUNNER_TEMP 'site-tools\site-tools.exe'
          "SITE_TOOLS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $selection = @(& $tools check_site --ci-metadata-only)
          if ($LASTEXITCODE -ne 0 -or $selection.Count -ne 1 -or $selection[0] -cnotin @('true', 'false')) {
            throw 'Invalid CI metadata selection'
          }
          "metadata_only=$($selection[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          name: served-site
          path: ${{ runner.temp }}/served-site-archive
      - name: Unpack prebuilt site for browser server
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        shell: pwsh
        run: |
          $serveDir = Join-Path $env:RUNNER_TEMP 'served-site'
          New-Item -ItemType Directory -Force -Path $serveDir | Out-Null
          tar.exe -xf (Join-Path $env:RUNNER_TEMP 'served-site-archive\served-site.tar') -C $serveDir
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -PathType Leaf (Join-Path $serveDir 'index.html'))) {
            throw 'Failed to unpack prebuilt site artifact'
          }
          "SITE_SERVE_DIR=$serveDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser-test dependencies
        # No locked package has an install script; this keeps it that way.
        run: npm ci --ignore-scripts
      - name: Check calculator and WebMCP contracts
        if: ${{ matrix.shard == 1 }}
        run: npm run typecheck
      # The browser build for the locked Playwright, kept between runs and keyed on
      # Playwright's list of browser builds. Main saves it; pull requests only read it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install Chromium
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        # The locked Playwright, as the Lighthouse job runs it; npx could fetch another.
        shell: bash
        run: ./node_modules/.bin/playwright install chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/AppData/Local/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Proof capture check
        if: ${{ steps.metadata.outputs.metadata_only == 'false' && matrix.shard == 1 }}
        run: npm run test:capture
      - name: Browser checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            work/playwright-report
            work/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies
        # Save browser evidence before a registry outage or advisory fails
        # this job, while keeping the audit mandatory.
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: npm audit --audit-level=high

  lighthouse:
    needs: tools
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # lighthouserc.cjs splits the pages by LHCI_SHARD.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Select metadata-only Lighthouse checks
        id: metadata
        env:
          CI_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          # Artifacts drop the executable bit. Lighthouse's server runs the same
          # binary (lighthouserc.cjs).
          tools="$RUNNER_TEMP/site-tools/site-tools"
          chmod +x "$tools"
          printf 'SITE_TOOLS=%s\n' "$tools" >> "$GITHUB_ENV"
          "$tools" check_site --ci-metadata-only > "$RUNNER_TEMP/ci-metadata-selection.txt"
          mapfile -t selection < "$RUNNER_TEMP/ci-metadata-selection.txt"
          if [[ ${#selection[@]} != 1 || ( ${selection[0]} != true && ${selection[0]} != false ) ]]; then
            echo "Invalid CI metadata selection" >&2
            exit 1
          fi
          printf 'metadata_only=%s\n' "${selection[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          name: served-site
          path: ${{ runner.temp }}/served-site-archive
      - name: Unpack prebuilt site for Lighthouse server
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          serve_dir="$RUNNER_TEMP/served-site"
          mkdir -p "$serve_dir"
          tar --extract --file "$RUNNER_TEMP/served-site-archive/served-site.tar" --directory "$serve_dir"
          test -f "$serve_dir/index.html"
          printf 'SITE_SERVE_DIR=%s\n' "$serve_dir" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          node-version: "24"
          cache: npm
      - name: Install quality dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: npm ci --ignore-scripts
      # The browser build for the locked Playwright, kept and keyed as in the
      # browser job; the system libraries it needs are still installed each run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install Chromium and system dependencies
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.metadata.outputs.metadata_only == 'false' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Lighthouse checks
        if: ${{ steps.metadata.outputs.metadata_only == 'false' }}
        env:
          LHCI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:lighthouse
      - name: Upload Lighthouse evidence
        # Evidence is for diagnosing a failed assertion; a passing run's
        # reports are about 20 MB each and nothing reads them.
        if: ${{ failure() && steps.metadata.outputs.metadata_only == 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-evidence-${{ matrix.shard }}
          path: |
            .lighthouseci
            work/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  fuzzing:
    name: fuzz the changelog feed builder
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs weekly and on demand rather than on pull requests or merges.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned nightly
        run: rustup toolchain install nightly-2026-10-15 --profile minimal
      # Keeps the fuzz build and the installed cargo-fuzz between runs, so the
      # locked source install below is a no-op once cached.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: scripts/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned fuzzer
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the feed builder
        run: >-
          cargo +nightly-2026-10-15 fuzz run feed fuzz-corpus/feed --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  checks-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [coal-lsl-service, lint, tools, rust-windows, checks, rust-coverage, browser, lighthouse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/checks.yml checks-gates --exempt deploy --exempt fuzzing --exempt publication --exempt codecov

  publication:
    # Its own job so that only main pushes, never pull request code, get the
    # token that reads code scanning alerts (check_publication reads main's).
    needs: checks-gates
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks-gates.result == 'success' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Require external publication results for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x "$RUNNER_TEMP/site-tools/site-tools"
          "$RUNNER_TEMP/site-tools/site-tools" check_publication --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600

  deploy:
    needs: [checks-gates, publication]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks-gates.result == 'success' && needs.publication.result == 'success' && vars.PAGES_VALIDATED_DEPLOYMENT == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      # Built by the read-only tools job; this job compiles nothing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-tools-Linux
          path: ${{ runner.temp }}/site-tools
      - name: Download the validated artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages-${{ github.sha }}
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify the artifact before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/validated-site"
          tar --extract --file "$RUNNER_TEMP/pages-artifact/artifact.tar" --directory "$RUNNER_TEMP/validated-site"
          python3 -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"validated-site/.well-known/deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          chmod +x "$RUNNER_TEMP/site-tools/site-tools"
          "$RUNNER_TEMP/site-tools/site-tools" check_production --source-root "$RUNNER_TEMP/validated-site" --source-only
      - name: Revalidate main and external results after environment admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/site-tools/site-tools" check_publication --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --wait-seconds 600
      - name: Deploy the artifact from this run
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.sha }}
      - name: Verify the published source identity and delivery contract
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Pages reports an http:// URL, which the CDN answers with a redirect to HTTPS.
          site="https://${PAGE_URL#*://}"
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "${site%/}/.well-known/deployment.json?revision=$GITHUB_SHA" \
            -o "$RUNNER_TEMP/deployment.json"
          python3 -c 'import json,os,pathlib; assert json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"deployment.json").read_text())["sha"] == os.environ["GITHUB_SHA"]'
          "$RUNNER_TEMP/site-tools/site-tools" check_production --source-root "$RUNNER_TEMP/validated-site"
      - name: Notify IndexNow of recently updated URLs
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/indexnow.json"
          import datetime, json, os, pathlib, xml.etree.ElementTree as ET

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "validated-site"
          key = (root / "d8fee9bfe727ec519b462f3401e7a0ae.txt").read_text(encoding="utf-8").strip()
          cutoff = (datetime.date.today() - datetime.timedelta(days=7)).isoformat()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          by_url = {}
          for rel in ("sitemap.xml", "tools/depreciation-rates/sitemap.xml"):
              path = root / rel
              if not path.is_file():
                  continue
              tree = ET.parse(path)
              for node in tree.findall("sm:url", ns):
                  loc = node.findtext("sm:loc", default="", namespaces=ns).strip()
                  lastmod = node.findtext("sm:lastmod", default="", namespaces=ns).strip()
                  if loc.startswith("https://duguid.com.au/") and lastmod >= cutoff:
                      if lastmod > by_url.get(loc, ""):
                          by_url[loc] = lastmod
          urls = [loc for loc, _ in sorted(by_url.items(), key=lambda item: (item[1], item[0]), reverse=True)][:10000]
          if not urls:
              urls = ["https://duguid.com.au/"]
          print(json.dumps({
              "host": "duguid.com.au",
              "key": key,
              "keyLocation": f"https://duguid.com.au/{key}.txt",
              "urlList": urls,
          }))
          PY
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --max-time 30 \
            -H "Content-Type: application/json; charset=utf-8" \
            -X POST "https://api.indexnow.org/indexnow" \
            --data @"$RUNNER_TEMP/indexnow.json"
