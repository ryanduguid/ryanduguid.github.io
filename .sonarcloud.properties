# SonarQube Cloud automatic analysis settings.
# Each static HTML page repeats the shared head by design, so a sitewide
# stylesheet or metadata change would otherwise count as duplicated new code.
sonar.cpd.exclusions=**/*.html

# Test code is analysed with the test rules and kept out of the production
# measures. Sources and tests both start at the root; the same patterns move
# test files from one set to the other, so no file is in both.
#
# The last 3 patterns are generated output that `site-tools` writes and
# commits, because GitHub Pages has no build step: the effective life pages
# (`build_effective_life_pages`) and the Ozzit module reference pages. Their
# generators and templates in scripts/ stay in scope. Analysing the output
# repeated each template finding once per page: every scrollable table region
# is focusable (tabindex="0") so keyboard users can scroll it, and 7,678 pages
# turned that one pattern into more than 18,000 issues.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts,tools/depreciation-rates/industry/**,tools/depreciation-rates/asset/**,tools/ozzit/functions/**
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts

# The analyser supports Python up to 3.14; this code targets Python 3.14 and later.
sonar.python.version=3.14
