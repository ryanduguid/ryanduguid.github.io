# Tool configuration only. The site's checks are the Rust crate in scripts/
# (`site-tools`); the Python left under scripts/ is the Search Console tool's
# test and two image renderers, and nothing here is installed or built. The
# Search Console tool under .agents/ declares its own inline script metadata and
# runs through uv, so it is not part of this configuration. The About portrait
# renderer, scripts/render_about_portrait.py, also declares its own dependencies
# and runs through uv; it builds an image, not a check. So does
# scripts/encode_cash_chart_webp.py, which encodes the cash chart copies.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["scripts"]
extend-exclude = [".agents"]

[tool.ruff.lint]
# Ruff's default set plus import sorting: pycodestyle errors that are not
# formatting opinions (E4, E7, E9), all of pyflakes (F), and isort (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["scripts"]
ignore_missing_imports = true
pretty = true
